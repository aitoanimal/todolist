<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>5日間の できた！手帳</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
:root{--ink:#5b4544;--paper:#fffaf2;--pink:#ff8fac;--pink-soft:#ffe2ea;--yellow:#ffd95f;--orange:#ffae68;--blue:#9bdcf1;--mint:#bce8ce;--line:#efdccf}
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:"Zen Maru Gothic",sans-serif;background:linear-gradient(130deg,#ffecb4,#ffebef 48%,#d8f3fa)}
body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;opacity:.56;filter:blur(1px)}
body:before{width:230px;height:230px;background:#f9b9d1;top:-82px;right:-58px}.body:after{width:180px;height:180px;background:#b9eaf7;bottom:-65px;left:-45px}
button,input{font:inherit}button{cursor:pointer}.app{width:min(100% - 24px,1200px);margin:auto;padding:24px 0 45px;position:relative;z-index:1}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding:0 8px}.brand{display:flex;align-items:center;gap:12px;font-family:"Kiwi Maru",serif;font-size:18px}
.brand-mark{width:42px;height:42px;border-radius:15px 15px 15px 5px;display:grid;place-items:center;background:var(--pink);color:white;font-size:23px;transform:rotate(-5deg);box-shadow:3px 4px 0 #e77194}
.week-label{padding:9px 14px;background:#fff9;border:1px solid #fff;border-radius:99px;font-size:13px;font-weight:700}
.diary{background:var(--paper);border-radius:31px;padding:clamp(18px,3vw,38px);box-shadow:0 18px 45px #9b6c6b35;overflow:hidden}
.hero{padding-left:12px;position:relative}.hero:after{content:"";display:block;border-bottom:2px dashed #f4d8d1;margin-top:20px}
.eyebrow{font-size:13px;color:#d47288;letter-spacing:.08em;font-weight:700}
h1{margin:5px 0;font-family:"Kiwi Maru",serif;font-size:clamp(28px,5vw,46px)}.hero p{margin:0;font-size:14px}.flower{position:absolute;right:10px;top:-3px;font-size:48px}
.week-nav{display:flex;gap:8px;overflow:auto;padding:20px 0 4px}.day-tab{border:0;min-width:100px;padding:11px 13px;border-radius:16px;background:#fff;border:2px solid #f3dfd6;color:var(--ink);font-weight:700}
.day-tab.active{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 3px 0 #df7795}.day-tab .small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.summary-card{background:#fff;border-radius:16px;padding:12px;text-align:center}.summary-card strong{display:block;font-size:20px}.summary-card span{font-size:11px;color:#927e76}
.task-area{margin-top:22px}.day-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.day-title h2{font-family:"Kiwi Maru",serif;font-size:25px;margin:0}.progress{font-size:12px;font-weight:700;color:#b49354}
.progressbar{height:9px;background:#f2e5df;border-radius:99px;overflow:hidden;margin:10px 0 16px}.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:99px;transition:width .25s}
.task-board{background:var(--pink-soft);border-radius:23px;padding:15px}.task-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}.task{display:flex;align-items:center;gap:10px;background:#fffc;border-radius:14px;min-height:53px;padding:8px 11px;box-shadow:0 2px 0 #ffffffa6}
.task label{display:flex;gap:10px;align-items:center;flex:1;cursor:pointer;font-size:14px;font-weight:500}.task input{appearance:none;width:22px;height:22px;border:2px solid #ef8ba2;border-radius:8px;background:#fff;display:grid;place-content:center;flex:none}
.task input:before{content:"✓";color:#fff;font-size:16px;font-weight:700;transform:scale(0);transition:.15s}.task input:checked{background:var(--pink);border-color:var(--pink)}.task input:checked:before{transform:scale(1)}
.task input:checked + .task-text{text-decoration:line-through;color:#9c8580}.task-text{overflow-wrap:anywhere}.completed-area{margin-top:22px}.completed-board{background:#fff3be}.done-task label{color:#8a7753}.delete{width:30px;height:30px;border:0;background:transparent;color:#bb9290;border-radius:50%;font-size:19px}.delete:hover{background:#f7d7d5}
.add-wrap{display:flex;gap:8px;margin-top:10px}.add-button{border:0;padding:10px 13px;border-radius:13px;color:#a34b64;background:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 0 #f1bbc8}
.add-form{display:none;flex:1;gap:7px}.add-form.open{display:flex}.add-form input{min-width:0;flex:1;padding:10px 12px;border:2px solid #f4c6d2;border-radius:12px;outline:none;color:var(--ink)}.add-submit{border:0;border-radius:12px;padding:7px 14px;color:#fff;background:var(--pink);font-weight:700}
.week-view{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:24px}.mini-day{background:#fff;border-radius:19px;padding:13px}.mini-day h3{margin:0 0 8px;font-family:"Kiwi Maru",serif;font-size:16px}.mini-count{font-size:11px;color:#8d7770;margin-bottom:8px}.mini-list{display:grid;gap:6px}.mini-item{font-size:11px;background:#fff6f8;border-radius:10px;padding:7px}.mini-item.done{text-decoration:line-through;opacity:.55}.empty{font-size:11px;color:#a58d82}
.hint{margin:18px 0 0;padding:13px 16px;background:#eef9e9;border-radius:15px;color:#568367;font-size:13px}
.toast{position:fixed;z-index:10;left:50%;top:24px;transform:translate(-50%,-140%);width:min(420px,calc(100% - 32px));padding:15px 18px;border-radius:18px;background:#ff7299;color:#fff;box-shadow:0 10px 24px #b7476c55;text-align:center;font-family:"Kiwi Maru",serif;transition:.38s}.toast.show{transform:translate(-50%,0)}
@media(max-width:800px){.summary{grid-template-columns:repeat(3,1fr)}.week-view{grid-template-columns:1fr 1fr}.app{width:min(100% - 14px,650px)}}
@media(max-width:520px){.summary{grid-template-columns:1fr 1fr}.week-view{grid-template-columns:1fr}.diary{border-radius:24px;padding:20px 13px}.day-tab{min-width:88px}.add-wrap{flex-direction:column}.add-form{width:100%}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">✓</span><span>できた！5日間手帳</span></div><div class="week-label" id="weekLabel"></div></header>
<section class="diary">
<header class="hero"><div class="eyebrow">MONDAY → FRIDAY</div><h1>5日間、いい一週間にしよう。</h1><p>毎日の小さな「できた」を、ひとつずつ集めようね。</p><span class="flower">🌼</span></header>
<nav class="week-nav" id="dayTabs" aria-label="曜日選択"></nav>
<section class="summary" id="summary"></section>
<section class="task-area">
<div class="day-title"><h2 id="dayTitle"></h2><span class="progress" id="progressText"></span></div>
<div class="progressbar"><i id="progressBar"></i></div>
<div class="task-board"><ul class="task-list" id="taskList"></ul>
<div class="add-wrap"><button class="add-button" id="addButton">＋ やることを追加</button>
<form class="add-form" id="addForm"><input id="taskInput" maxlength="100" placeholder="たとえば、お花に水をあげる" required><button class="add-submit">追加</button></form></div></div>
</section>
<section class="week-view" id="weekView"></section>
<p class="hint">💡 チェックしたToDoは曜日ごとに保存されます。ブラウザを閉じても内容は残ります。</p>
</section></main>
<div class="toast" id="toast"></div>
<script>
const KEY='dekita-5days-v1';
const dayNames=['月曜日','火曜日','水曜日','木曜日','金曜日'];
const dayShort=['月','火','水','木','金'];
const defaults={月曜日:['朝の予定を確認する','メール・連絡を確認する','今日の最優先タスクに取り組む'],火曜日:['昨日の振り返りをする','重要な作業を1つ終わらせる','明日の準備をする'],水曜日:['週の進み具合を確認する','資料やデータを整理する','休憩をしっかり取る'],木曜日:['残っているタスクを確認する','集中して作業する','金曜日の準備をする'],金曜日:['今週のToDoを振り返る','未完了のタスクを整理する','来週の予定をメモする']};
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}
if(!state) state={days:Object.fromEntries(dayNames.map(d=>[d,{tasks:defaults[d].map(text=>({id:crypto.randomUUID(),text})),done:[]}]))};
else state.days=Object.fromEntries(dayNames.map(d=>{
  const v=state.days?.[d]||[];
  return [d,Array.isArray(v)?{tasks:v.filter(x=>!x.done),done:v.filter(x=>x.done).map(x=>({id:x.id||crypto.randomUUID(),text:x.text}))}:{tasks:v.tasks||[],done:v.done||[]}];
}));
let selected=new Date().getDay(); selected=selected===0?0:selected===6?4:selected-1;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function currentDay(){return dayNames[selected]}
function renderTabs(){document.getElementById('dayTabs').innerHTML=dayNames.map((d,i)=>`<button class="day-tab ${i===selected?'active':''}" data-i="${i}">${dayShort[i]}曜日<span class="small">${state.days[d].filter(x=>x.done).length}/${state.days[d].length} 完了</span></button>`).join('')}
function renderSummary(){document.getElementById('summary').innerHTML=dayNames.map(d=>`<div class="summary-card"><strong>${d.replace('曜日','')}</strong><span>曜日</span></div>`).join('')}
function renderTasks(){
  let d=currentDay(),data=state.days[d],tasks=data.tasks,done=data.done;
  document.getElementById('dayTitle').textContent=d+'のToDo';
  document.getElementById('progressText').textContent=`${tasks.length}件`;
  document.getElementById('progressBar').style.width=(tasks.length?'100%':'0%');document.getElementById('doneCount').textContent=`${done.length}件できた！`;
  document.getElementById('taskList').innerHTML=tasks.map(t=>`<li class="task"><label><input type="checkbox" data-id="${t.id}"><span class="task-text">${escapeHtml(t.text)}</span></label><button class="delete" data-del="${t.id}" aria-label="削除">×</button></li>`).join('')||'<li class="empty">この日のToDoはまだありません。追加してみよう 🌷</li>';
  document.getElementById('doneList').innerHTML=done.map(t=>`<li class="task done-task"><label><input type="checkbox" checked disabled><span class="task-text">${escapeHtml(t.text)}</span></label><button class="delete" data-done-del="${t.id}" aria-label="削除">×</button></li>`).join('')||'<li class="empty">できたことが、ここに咲いていくよ 🌷</li>';
}
function renderWeek(){document.getElementById('weekView').innerHTML=dayNames.map(d=>{let data=state.days[d];return `<div class="mini-day"><h3>${d}</h3><div class="mini-count">ToDo ${data.tasks.length}件・できた ${data.done.length}件</div><div class="mini-list">${data.tasks.slice(0,4).map(t=>`<div class="mini-item">${escapeHtml(t.text)}</div>`).join('')||'<div class="empty">ToDoなし</div>'}</div></div>`}).join('')}
function render(){let now=new Date(),m=now.getMonth()+1;document.getElementById('weekLabel').textContent=`${m}月・月〜金`;renderTabs();renderSummary();renderTasks();renderWeek()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('dayTabs').addEventListener('click',e=>{let b=e.target.closest('.day-tab');if(!b)return;selected=Number(b.dataset.i);render()});
document.getElementById('taskList').addEventListener('change',e=>{
  if(e.target.matches('input[type=checkbox]')){
    let data=state.days[currentDay()],index=data.tasks.findIndex(x=>x.id===e.target.dataset.id);
    if(index>=0){
      let t=data.tasks.splice(index,1)[0];
      data.done.unshift({id:t.id,text:t.text});
      save();render();celebrate();
    }
  }
});
document.getElementById('taskList').addEventListener('click',e=>{
  let id=e.target.dataset.del;
  if(id){state.days[currentDay()].tasks=state.days[currentDay()].tasks.filter(x=>x.id!==id);save();render()}
});
document.getElementById('doneList').addEventListener('click',e=>{
  let id=e.target.dataset.doneDel;
  if(id){state.days[currentDay()].done=state.days[currentDay()].done.filter(x=>x.id!==id);save();render()}
});
document.getElementById('addButton').onclick=()=>{let f=document.getElementById('addForm');f.classList.toggle('open');if(f.classList.contains('open'))document.getElementById('taskInput').focus()};
document.getElementById('addForm').onsubmit=e=>{e.preventDefault();let input=document.getElementById('taskInput'),text=input.value.trim();if(!text)return;state.days[currentDay()].push({id:crypto.randomUUID(),text,done:false});input.value='';e.target.classList.remove('open');save();render()};
function celebrate(){let words=['すごい！えらい！','できたね、最高！','その調子、その調子！','今日のあなた、100点！'];let t=document.getElementById('toast');t.textContent='🎉 '+words[Math.floor(Math.random()*words.length)];t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
render();
</script>
</body>
</html>
